# Serves the build output with caching switched off, so a browser reload
# always picks up the newest bundle. Home Assistant's own /local path sends
# Cache-Control: max-age=2678400, which makes card iteration miserable.
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
