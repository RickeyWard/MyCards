# Default dashboard (YAML mode): edit and reload the browser to iterate.
# Every card in the suite should have a case here, including the ugly ones.

views:
  - title: Cards
    path: cards
    cards:
      - type: custom:mycards-room-title-card
        name: Living Room
        icon: mdi:sofa
        icon_color: blue
        entity: light.living_room
        tap_action:
          action: toggle

      - type: custom:mycards-room-title-card
        name: Kitchen
        icon: mdi:countertop
        icon_color: amber
        entity: sensor.kitchen_temperature

      - type: custom:mycards-room-title-card
        name: Icon on the end
        icon: mdi:bed
        icon_color: purple
        icon_position: end
        entity: sensor.living_room_temperature

      - type: custom:mycards-room-title-card
        name: Bare glyph, no circle
        icon: mdi:washing-machine
        icon_color: teal
        icon_shape: none
        subtitle: No coloured background

      - type: custom:mycards-room-title-card
        name: Squared icon, end, right-aligned
        icon: mdi:garage
        icon_color: deep-orange
        icon_shape: square
        icon_position: end
        alignment: end
        subtitle: Subtitle hangs off the same edge

      - type: custom:mycards-room-title-card
        name: Big title
        icon: mdi:sofa
        icon_color: indigo
        title_size: 28
        entity: sensor.living_room_temperature

      - type: custom:mycards-room-title-card
        name: Small title
        icon: mdi:chevron-right
        icon_color: grey
        icon_shape: none
        title_size: 12
        subtitle: Subtitle follows the title

      - type: custom:mycards-room-title-card
        name: Tight gap
        icon: mdi:door
        icon_color: cyan
        icon_shape: none
        icon_gap: 2
        subtitle: Icon nearly touching the text

      - type: custom:mycards-room-title-card
        name: Wide gap
        icon: mdi:sofa
        icon_color: blue
        icon_gap: 32
        subtitle: Pushed well apart

      - type: custom:mycards-room-title-card
        name: Large icon and title
        icon: mdi:sofa
        icon_color: indigo
        icon_size: 64
        title_size: 28
        subtitle: Both scaled together

      - type: custom:mycards-room-title-card
        name: Small bare icon
        icon: mdi:chevron-right
        icon_color: grey
        icon_shape: none
        icon_size: 18
        title_size: 13
        icon_gap: 4

      - type: custom:mycards-room-title-card
        name: Icon pinned to the top
        icon: mdi:stairs
        icon_color: brown
        icon_align: top
        subtitle: Two lines, icon aligned with the first

      - type: custom:mycards-room-title-card
        name: Loud subtitle
        icon: mdi:thermometer
        icon_color: red
        title_size: 18
        subtitle_scale: 110
        subtitle_gap: 6
        entity: sensor.living_room_temperature

      - type: custom:mycards-room-title-card
        name: Quiet subtitle
        icon: mdi:water-percent
        icon_color: light-blue
        subtitle_scale: 60
        subtitle: Small print

      - type: custom:mycards-room-title-card
        name: Transparent heading
        icon: mdi:format-title
        icon_color: purple
        transparent: true
        subtitle: No card behind it

      - type: custom:mycards-room-title-card
        name: Centered with subtitle
        icon: mdi:home-heart
        icon_color: pink
        alignment: center
        subtitle: Text centres too

      - type: custom:mycards-room-title-card
        name: Centered, no icon
        subtitle: Static subtitle
        alignment: center
        hide_icon: true

      - type: custom:mycards-room-title-card
        name: Unavailable entity
        icon: mdi:alert
        icon_color: red
        entity: sensor.broken_sensor

      - type: custom:mycards-room-title-card
        entity: binary_sensor.front_door
        icon_color: green
        hold_action:
          action: more-info
        double_tap_action:
          action: navigate
          navigation_path: /lovelace/cards
